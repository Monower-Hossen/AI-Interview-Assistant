<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Assistant - Professional Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #3498db; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background: var(--primary-color); color: white; min-height: 100vh; padding: 20px; }
        .chat-container { height: 400px; overflow-y: auto; border-radius: 10px; background: white; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 15px; max-width: 80%; }
        .ai-message { background: #e9ecef; align-self: flex-start; }
        .user-message { background: var(--accent-color); color: white; align-self: flex-end; margin-left: auto; }
        .metrics-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .status-indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background: #2ecc71; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <h4 class="mb-4">Interview Panel</h4>
                <div class="mb-4">
                    <label class="form-label">Job Role</label>
                    <input type="text" id="jobRole" class="form-control mb-2" value="Software Engineer">
                    <label class="form-label">Language</label>
                    <select id="lang" class="form-select">
                        <option value="bn">Bengali</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <hr>
                <div class="mb-4">
                    <h6>Resume Upload</h6>
                    <input type="file" id="resumeInput" class="form-control form-control-sm mb-2">
                    <button onclick="uploadResume()" class="btn btn-outline-light btn-sm w-100">Upload PDF</button>
                </div>
                <button onclick="resetInterview()" class="btn btn-danger btn-sm w-100 mt-5">Reset Session</button>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">AI Interview Dashboard</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <span class="me-3 mt-1"><span class="status-indicator status-online"></span> Live Session</span>
                        <button onclick="startInterview()" class="btn btn-sm btn-primary">Start Interview</button>
                    </div>
                </div>

                <div class="row">
                    <!-- Chat Section -->
                    <div class="col-md-8">
                        <div id="chatBox" class="chat-container d-flex flex-column mb-3">
                            <div class="message ai-message">Welcome. Upload your resume and click 'Start' to begin.</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button id="recordBtn" class="btn btn-lg btn-success flex-grow-1">Hold to Speak</button>
                            <button onclick="getFeedback()" class="btn btn-lg btn-info">End & Get Report</button>
                        </div>
                    </div>

                    <!-- Advanced Metrics Section -->
                    <div class="col-md-4">
                        <div class="metrics-card">
                            <h5>Confidence Meter</h5>
                            <div class="progress mt-3" style="height: 25px;">
                                <div id="confidenceBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%">N/A</div>
                            </div>
                        </div>
                        <div class="metrics-card">
                            <h5>Fluency Analysis</h5>
                            <canvas id="fluencyChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Final Report Modal/Section -->
                <div id="reportSection" class="mt-4 p-4 bg-white rounded shadow d-none">
                    <h3>Final Evaluation Report</h3>
                    <hr>
                    <div id="reportContent" style="white-space: pre-line;"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let fluencyData = [];
        let labels = [];
        let turnCount = 0;

        // Initialize Chart
        const ctx = document.getElementById('fluencyChart').getContext('2d');
        const fluencyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Words per Response',
                    data: fluencyData,
                    borderColor: '#3498db',
                    tension: 0.1
                }]
            }
        });

        async function startInterview() {
            const response = await fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    job_role: document.getElementById('jobRole').value,
                    language: document.getElementById('lang').value
                })
            });
            const data = await response.json();
            addMessage(data.ai_response, 'ai');
            playAudio(data.audio_url);
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play();
        }

        // Audio Recording Logic
        const recordBtn = document.getElementById('recordBtn');
        recordBtn.onmousedown = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
            audioChunks = [];
            recordBtn.innerText = "Recording... Release to Send";
            recordBtn.className = "btn btn-lg btn-danger flex-grow-1";

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        };

        recordBtn.onmouseup = () => {
            mediaRecorder.stop();
            recordBtn.innerText = "Processing...";
            recordBtn.className = "btn btn-lg btn-warning flex-grow-1";

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('audio', audioBlob);
                formData.append('job_role', document.getElementById('jobRole').value);
                formData.append('language', document.getElementById('lang').value);

                const response = await fetch('/interview', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                addMessage(data.candidate_text, 'user');
                addMessage(data.ai_response, 'ai');
                playAudio(data.audio_url);
                updateMetrics(data.metrics);
                
                recordBtn.innerText = "Hold to Speak";
                recordBtn.className = "btn btn-lg btn-success flex-grow-1";
            };
        };

        function updateMetrics(metrics) {
            if (!metrics) return;
            
            // Update Chart
            turnCount++;
            labels.push(`Q${turnCount}`);
            fluencyData.push(metrics.word_count);
            fluencyChart.update();

            // Update Confidence Meter
            const conf = metrics.confidence;
            const bar = document.getElementById('confidenceBar');
            if (conf && conf !== "N/A") {
                let value = 0;
                if (conf.toLowerCase().includes('high')) value = 90;
                else if (conf.toLowerCase().includes('medium')) value = 60;
                else value = 30;
                
                bar.style.width = value + '%';
                bar.innerText = conf;
                bar.className = `progress-bar progress-bar-striped progress-bar-animated ${value > 50 ? 'bg-success' : 'bg-warning'}`;
            }
        }

        async function uploadResume() {
            const file = document.getElementById('resumeInput').files[0];
            if (!file) return alert("Please select a file");
            const formData = new FormData();
            formData.append('resume', file);
            const res = await fetch('/upload_resume', { method: 'POST', body: formData });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function getFeedback() {
            const res = await fetch('/feedback');
            const data = await res.json();
            document.getElementById('reportSection').classList.remove('d-none');
            document.getElementById('reportContent').innerText = data.report;
            document.getElementById('reportSection').scrollIntoView();
        }

        async function resetInterview() {
            await fetch('/reset', { method: 'POST' });
            location.reload();
        }
    </script>
</body>
</html>
