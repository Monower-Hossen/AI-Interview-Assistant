[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "BLE001",
    "S110",
    "DTZ005",
    "DTZ007",
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
mypy_path = "."
exclude = [".venv/", "data/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[project]
name = "ai-interview-assistant"
version = "1.0.0"
description = "AI-powered interview preparation platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pypdf>=3.15.0",
    "python-docx>=1.1.0",
    "python-magic>=0.4.27",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "faster-whisper>=1.0.0",
    "langchain-core>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "numpy>=1.26.0",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]
